name: Network Check

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Read complete Turkey catalog
        run: |
          python3 - <<'PY'
          import json, time, urllib.request, gzip, os

          LANG = "de"
          NOW = int(time.time() * 1000)

          ping = {
              "reason": "app-focus",
              "locale": LANG,
              "theme": "dark",
              "metadata": {
                  "device": {"type": "desktop", "uniqueId": f"gh-{NOW}"},
                  "os": {"name": "linux", "version": "Linux", "abis": ["x64"], "host": "node"},
                  "app": {"platform": "electron"},
                  "version": {"package": "tv.vavoo.app", "binary": "3.1.8", "js": "3.1.8"}
              },
              "appFocusTime": 0,
              "playerActive": False,
              "playDuration": 0,
              "devMode": False,
              "hasAddon": True,
              "castConnected": False,
              "package": "tv.vavoo.app",
              "version": "3.1.8",
              "process": "app",
              "firstAppStart": NOW,
              "lastAppStart": NOW,
              "ipLocation": None,
              "adblockEnabled": True,
              "proxy": {"supported": ["ss"], "engine": "Mu", "enabled": False, "autoServer": True},
              "iap": {"supported": False}
          }

          def post(url, data, headers):
              req = urllib.request.Request(
                  url,
                  data=json.dumps(data).encode(),
                  headers=headers,
                  method="POST"
              )
              with urllib.request.urlopen(req, timeout=35) as response:
                  raw = response.read()
                  if raw[:2] == b"\x1f\x8b":
                      raw = gzip.decompress(raw)
                  return json.loads(raw)

          print("Vavoo imzası alınıyor...")
          signature_data = post(
              "https://www.vavoo.tv/api/app/ping",
              ping,
              {
                  "Content-Type": "application/json",
                  "User-Agent": "MediaHubMX/2",
                  "Accept": "*/*"
              }
          )

          signature = signature_data.get("addonSig")
          if not signature:
              raise RuntimeError("Vavoo imzası alınamadı")

          headers = {
              "Content-Type": "application/json; charset=utf-8",
              "mediahubmx-signature": signature,
              "User-Agent": "MediaHubMX/2",
              "Accept": "*/*",
              "Accept-Language": LANG
          }

          hosts = ["vavoo.to", "kool.to"]
          result = None

          for host in hosts:
              print(f"\nKatalog sunucusu: {host}")
              try:
                  cursor = None
                  seen_cursors = set()
                  channels = {}
                  pages = 0

                  while True:
                      payload = {
                          "language": LANG,
                          "region": "TR",
                          "catalogId": "iptv",
                          "id": "iptv",
                          "adult": False,
                          "search": "",
                          "sort": "",
                          "filter": {},
                          "cursor": cursor,
                          "clientVersion": "3.0.2"
                      }

                      data = post(
                          f"https://{host}/mediahubmx-catalog.json",
                          payload,
                          headers
                      )

                      pages += 1
                      items = data.get("items", [])

                      for item in items:
                          if item.get("type") != "iptv":
                              continue

                          group = str(item.get("group", "")).strip().lower()
                          if group not in ("turkey", "türkiye", "turkiye"):
                              continue

                          channel_id = str(item.get("id") or item.get("url") or "")
                          if not channel_id:
                              continue

                          channels[channel_id] = {
                              "id": channel_id,
                              "name": str(item.get("name", "")).strip(),
                              "group": str(item.get("group", ""))
                          }

                      print(
                          f"Sayfa {pages}: {len(items)} kayıt, "
                          f"Türkiye toplam {len(channels)}"
                      )

                      next_cursor = data.get("nextCursor")
                      if not next_cursor:
                          break

                      cursor_key = json.dumps(
                          next_cursor, sort_keys=True, ensure_ascii=False
                      )

                      if cursor_key in seen_cursors:
                          raise RuntimeError("Tekrarlanan sayfalama imleci")
                      seen_cursors.add(cursor_key)

                      if pages >= 100:
                          raise RuntimeError("100 sayfa sınırına ulaşıldı")

                      cursor = next_cursor

                  result = {
                      "host": host,
                      "pages": pages,
                      "count": len(channels),
                      "channels": sorted(
                          channels.values(),
                          key=lambda x: x["name"].casefold()
                      )
                  }
                  break

              except Exception as error:
                  print("Sunucu hatası:", type(error).__name__, str(error)[:250])

          if result is None:
              raise RuntimeError("İki katalog sunucusu da başarısız")

          print("\n===== TÜRKİYE KATALOG SONUCU =====")
          print("Sunucu:", result["host"])
          print("Sayfa:", result["pages"])
          print("Toplam kanal:", result["count"])

          summary = os.environ["GITHUB_STEP_SUMMARY"]
          with open(summary, "a", encoding="utf-8") as f:
              f.write("# Türkiye kanal kataloğu\n\n")
              f.write(f"- Sunucu: `{result['host']}`\n")
              f.write(f"- Sayfa: **{result['pages']}**\n")
              f.write(f"- Toplam kanal: **{result['count']}**\n\n")
              f.write("| # | Kanal adı | Grup |\n|---:|---|---|\n")

              for index, channel in enumerate(result["channels"], 1):
                  name = channel["name"].replace("|", "\\|")
                  group = channel["group"].replace("|", "\\|")
                  f.write(f"| {index} | {name} | {group} |\n")

          print("\nKanal listesi GitHub Actions Summary bölümüne yazıldı.")

          if not result["count"]:
              raise RuntimeError("Türkiye kanal listesi boş")
          PY
